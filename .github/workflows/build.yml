name: Build BlueChat APK (desde ZIP)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Descomprimir el ZIP del proyecto
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*.zip" -not -path "./.git/*" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::No se encontró ningún .zip en el repositorio. Sube BlueChat-Android-Project.zip a la raíz."
            exit 1
          fi
          echo "Usando ZIP: $ZIP"
          rm -rf _proj && mkdir _proj
          unzip -q "$ZIP" -d _proj
          SETTINGS=$(find _proj -maxdepth 3 -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::El ZIP no contiene settings.gradle.kts. ¿Es el ZIP correcto?"
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Proyecto en: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          ls -la "$DIR"

      - name: Verificar integridad del Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar el Android SDK (ya viene en el runner)
        run: |
          SDKM=$(command -v sdkmanager || true)
          [ -z "$SDKM" ] && SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM=$(find "$ANDROID_HOME" "$ANDROID_SDK_ROOT" /usr/local/lib/android/sdk -name sdkmanager -type f 2>/dev/null | head -n 1)
          echo "sdkmanager: $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: ${{ env.PROJECT_DIR }}

      # El ZIP pierde el bit de ejecución de gradlew: se restituye aquí.
      - name: Dar permisos de ejecución a gradlew
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Ejecutar pruebas unitarias
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Compilar APK debug
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verificar que la APK existe
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No se generó ninguna APK"
            exit 1
          fi
          ls -lh "$APK"
          mkdir -p dist
          cp "$APK" dist/BlueChat-debug.apk

      - name: Publicar la APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: BlueChat-Debug-APK
          path: dist/BlueChat-debug.apk
          if-no-files-found: error

      - name: Publicar informes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BlueChat-Test-Reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/
          if-no-files-found: ignore
